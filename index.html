<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Res Arena - 图像超分辨率同步对比评测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        [v-cloak] { display: none; }
        /* 主体内容最大宽度，让图片能充分展开 */
        .main-content {
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }
        .sync-viewer-container {
            display: flex;
            gap: 12px;
            height: calc(100vh - 220px);
            overflow: hidden;
            width: 100%;
        }
        .sync-panel {
            flex: 1;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: grab;
            user-select: none;
        }
        .sync-panel:active { cursor: grabbing; }
        .sync-panel img {
            pointer-events: none;
            image-rendering: auto;
        }
        .img-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }
        .panel-label {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
            white-space: nowrap;
        }
        .zoom-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            color: #333;
        }
        .zoom-btn:hover { background: white; transform: scale(1.1); }
        .zoom-info {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            z-index: 10;
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    /* 简单的提示框上浮动画 */
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app" v-cloak class="h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b px-6 py-3 flex items-center justify-between shadow-sm z-10 shrink-0">
            <h1 class="text-lg font-bold flex items-center gap-2 text-gray-800">
                <i class="fa-solid fa-magnifying-glass-chart text-indigo-600"></i>
                Super-Res Arena
            </h1>
            <div class="flex items-center space-x-2 text-sm font-medium text-gray-600">
                <span>评测进度:</span>
                <span :class="{'text-green-600 font-bold': completedCount >= targetTaskCount}">
                    {{ completedCount }} / {{ targetTaskCount }}+
                </span>
                <div class="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div class="h-full transition-all duration-300"
                        :class="completedCount >= targetTaskCount ? 'bg-green-500' : 'bg-indigo-600'"
                        :style="{ width: Math.min(100, (completedCount / targetTaskCount) * 100) + '%' }">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="flex-1 overflow-hidden p-4 bg-gray-100 flex flex-col gap-3">
            
            <template v-if="currentTask && currentTask.originalId">
                <div class="main-content flex flex-col gap-3 h-full">
            <!-- 退化信息条 -->
            <div class="bg-white rounded-lg px-5 py-3 shadow-sm border flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <span class="font-bold text-gray-700">测试组 #{{ currentTask.originalId }}</span>
                    <span class="text-sm text-gray-500"><i class="fa-solid fa-circle-info text-indigo-400 mr-1"></i>{{ currentTask.description }}</span>
                </div>
                <div class="text-xs text-gray-400">滚轮缩放 · 拖拽平移 · 三图同步</div>
            </div>

            <!-- 三个同步面板 -->
            <div class="sync-viewer-container w-full">
                <!-- LR Panel -->
                <div class="sync-panel" ref="lrPanel" @mousedown="onMouseDown($event)" @wheel.prevent="onWheel($event)" @mousemove="onMouseMove($event)" @mouseup="onMouseUp" @mouseleave="onMouseUp">
                    <div class="panel-label">LR 原图 (低分辨率)</div>
                    <div class="img-wrapper" :style="wrapperStyle">
                        <img ref="lrImg" :src="currentTask.lrImage" @load="onImgLoad('lr')" />
                    </div>
                    <div class="zoom-info">{{ globalScale.toFixed(1) }}x</div>
                </div>

                <div class="sync-panel" ref="modelAPanel" @mousedown="onMouseDown($event)" @wheel.prevent="onWheel($event)" @mousemove="onMouseMove($event)" @mouseup="onMouseUp" @mouseleave="onMouseUp">
                    <div class="panel-label">
                        Model A <span v-if="revealed" class="text-indigo-300 ml-1">({{ currentTask.displayModelAName }})</span>
                        <span v-else class="text-gray-400 ml-1">(???)</span>
                    </div>
                    <div class="img-wrapper" :style="wrapperStyle">
                        <img ref="modelAImg" :src="currentTask.displayModelA" @load="onImgLoad('a')" />
                    </div>
                    <div class="zoom-info">{{ globalScale.toFixed(1) }}x</div>
                </div>

                <!-- Model B Panel -->
                <div class="sync-panel" ref="modelBPanel" @mousedown="onMouseDown($event)" @wheel.prevent="onWheel($event)" @mousemove="onMouseMove($event)" @mouseup="onMouseUp" @mouseleave="onMouseUp">
                    <div class="panel-label">
                        Model B <span v-if="revealed" class="text-indigo-300 ml-1">({{ currentTask.displayModelBName }})</span>
                        <span v-else class="text-gray-400 ml-1">(???)</span>
                    </div>
                    <div class="img-wrapper" :style="wrapperStyle">
                        <img ref="modelBImg" :src="currentTask.displayModelB" @load="onImgLoad('b')" />
                    </div>
                    <div class="zoom-info">{{ globalScale.toFixed(1) }}x</div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="bg-white rounded-xl shadow-sm border p-4 flex flex-col items-center gap-4 relative w-full shrink-0">
                <div class="flex flex-wrap justify-center gap-3">
                    <button @click="vote('A')" :disabled="revealed" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-hand-point-left"></i> Model A 细节更好
                    </button>
                    <button @click="vote('B')" :disabled="revealed" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
                        Model B 细节更好 <i class="fa-solid fa-hand-point-right"></i>
                    </button>
                    <button @click="vote('Tie')" :disabled="revealed" class="px-5 py-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-handshake"></i> 平局
                    </button>
                    <button @click="vote('BothBad')" :disabled="revealed" class="px-5 py-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-thumbs-down"></i> 都很差
                    </button>
                </div>

                <!-- 揭晓 -->
                <div class="mt-4 flex flex-col items-center">
                    <div v-if="revealed" class="px-6 py-2 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm font-bold shadow-inner mb-4 flex items-center animate-fade-in-up">
                        <i class="fa-solid fa-circle-check mr-2"></i> 
                        已记录! 真实模型为：左侧 = {{ currentTask.displayModelAName }} | 右侧 = {{ currentTask.displayModelBName }}
                    </div>
                </div>
            </div>

            </div>
            </template>

            <!-- 完成页面 -->
            <div v-else class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                <!-- 这里可以暂时留空，因为无限模式下很难走到这里，除非题库耗尽且不重复出题 -->
                <h2 class="text-3xl font-bold text-gray-800 mb-2">评测全部完成！</h2>
                <p class="text-gray-600 mb-8">您已评测完所有的照片组，感谢您的参与。</p>
            </div>

            <!-- 右下角悬浮提示 -->
            <div v-if="submitSuccess" class="fixed bottom-4 right-4 bg-green-100 text-green-700 px-4 py-2 rounded shadow-lg text-sm font-bold flex items-center animate-fade-in-up">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 投票已自动同步
            </div>

        </main>
    </div>

    <script src="./arena-files.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const localFiles = Array.isArray(window.ARENA_FILES) ? window.ARENA_FILES : [];
        const rawDatasets = localFiles.length > 0
            ? localFiles.map((filename, index) => {
                const basename = filename.replace(/\.[^.]+$/, '');
                return {
                    id: index + 1,
                    originalId: basename,
                    description: basename,
                    lrImage: `./RealSRVal_crop128/test_LR_bicubic_512/${filename}`,
                    modelA: `./flux2-4B/${filename}`,
                    modelB: `./SD3/${filename}`,
                    modelAName: 'flux2-4B',
                    modelBName: 'SD3'
                };
            })
            : [
                { id: 1, description: "Real-world degradation 4x upscale", lrImage: "https://picsum.photos/seed/lr1/800/800", modelA: "https://picsum.photos/seed/hr1a/800/800", modelB: "https://picsum.photos/seed/hr1b/800/800", modelAName: "Real-ESRGAN", modelBName: "SwinIR" },
                { id: 2, description: "Bicubic 4x + Gaussian Noise", lrImage: "https://picsum.photos/seed/lr2/800/800", modelA: "https://picsum.photos/seed/hr2a/800/800", modelB: "https://picsum.photos/seed/hr2b/800/800", modelAName: "BSRGAN", modelBName: "HAT" },
                { id: 3, description: "Severe degradation 4x upscale", lrImage: "https://picsum.photos/seed/lr3/800/800", modelA: "https://picsum.photos/seed/hr3a/800/800", modelB: "https://picsum.photos/seed/hr3b/800/800", modelAName: "CodeFormer", modelBName: "GFPGAN" },
                { id: 4, description: "Unknown real-world LR", lrImage: "https://picsum.photos/seed/lr4/800/800", modelA: "https://picsum.photos/seed/hr4a/800/800", modelB: "https://picsum.photos/seed/hr4b/800/800", modelAName: "StableSR", modelBName: "Real-ESRGAN" }
            ];

        const shuffleArray = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        createApp({
            setup() {
                // 用于追踪当前会话的唯一ID，区分不同用户的评测轮次
                const sessionId = ref(Math.random().toString(36).substring(2, 10) + Date.now().toString(36));
                
                // 目标评测组数
                const targetTaskCount = 30;
                // 已经完成的评测组数
                const completedCount = ref(0);

                const tasks = ref([]);
                const currentTaskIndex = ref(0);
                const revealed = ref(false);
                const isFinished = ref(false);
                const results = ref([]);

                // 同步状态
                const globalScale = ref(1);
                const globalOffsetX = ref(0);
                const globalOffsetY = ref(0);
                const imgNaturalSize = { lr: { w: 800, h: 800 }, a: { w: 800, h: 800 }, b: { w: 800, h: 800 } };
                let isDragging = false;
                let dragStartX = 0, dragStartY = 0;
                let dragStartOffsetX = 0, dragStartOffsetY = 0;

                // 产生一个随机洗牌且A/B盲测互换顺序的题库队列
                const generateQueue = () => {
                    // 这里为了能评测超过题库数量，允许重复出题，如果真实题库大于30，就不需要扩展了。
                    // 此处通过多拼几次来生成至少大于30组的随机序列。
                    let extendedPool = [];
                    for(let i=0; i<10; i++) {
                        extendedPool = extendedPool.concat(JSON.parse(JSON.stringify(rawDatasets)));
                    }

                    const shuffled = shuffleArray(extendedPool);
                    return shuffled.map(item => {
                        const swapped = Math.random() > 0.5;
                        return {
                            originalId: item.originalId || item.id,
                            description: item.description,
                            lrImage: item.lrImage,
                            displayModelA: swapped ? item.modelB : item.modelA,
                            displayModelB: swapped ? item.modelA : item.modelB,
                            displayModelAName: swapped ? item.modelBName : item.modelAName,
                            displayModelBName: swapped ? item.modelAName : item.modelBName,
                            isSwapped: swapped
                        };
                    });
                };

                const initTasks = () => {
                    tasks.value = generateQueue();
                };

                const resetViewer = () => {
                    globalScale.value = 1;
                    globalOffsetX.value = 0;
                    globalOffsetY.value = 0;
                };

                onMounted(() => {
                    initTasks();
                });

                const currentTask = computed(() => tasks.value[currentTaskIndex.value] || {});

                const wrapperStyle = computed(() => {
                    return {
                        transform: `translate(${globalOffsetX.value}px, ${globalOffsetY.value}px) scale(${globalScale.value})`
                    };
                });

                const onImgLoad = (panel) => {
                    const img = panel === 'lr' ? document.querySelector('.sync-panel:nth-child(1) img') :
                                panel === 'a' ? document.querySelector('.sync-panel:nth-child(2) img') :
                                document.querySelector('.sync-panel:nth-child(3) img');
                    if (img && img.naturalWidth) {
                        imgNaturalSize[panel] = { w: img.naturalWidth, h: img.naturalHeight };
                    }
                };

                const onWheel = (e) => {
                    const delta = e.deltaY > 0 ? 0.85 : 1.15;
                    const oldScale = globalScale.value;
                    const newScale = Math.min(Math.max(oldScale * delta, 0.1), 30);
                    const factor = newScale / oldScale;

                    const rect = e.currentTarget.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left - rect.width / 2;
                    const mouseY = e.clientY - rect.top - rect.height / 2;

                    globalOffsetX.value = mouseX - factor * (mouseX - globalOffsetX.value);
                    globalOffsetY.value = mouseY - factor * (mouseY - globalOffsetY.value);
                    globalScale.value = newScale;
                };

                const onMouseDown = (e) => {
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    dragStartOffsetX = globalOffsetX.value;
                    dragStartOffsetY = globalOffsetY.value;
                };

                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    globalOffsetX.value = dragStartOffsetX + (e.clientX - dragStartX);
                    globalOffsetY.value = dragStartOffsetY + (e.clientY - dragStartY);
                };

                const onMouseUp = () => {
                    isDragging = false;
                };

                const vote = async (choice) => {
                    if (revealed.value) return;
                    revealed.value = true;
                    
                    // 记录结果 (存入本地数组)
                    const winnerName = choice === 'A' ? currentTask.value.displayModelAName :
                                       choice === 'B' ? currentTask.value.displayModelBName : null;
                    
                    const record = {
                        originalId: currentTask.value.originalId,
                        choice: choice,
                        winnerName: winnerName,
                        // 顺便把这一题的 AB 是谁记录下来，防止无限循环题库时找错
                        modelA: currentTask.value.displayModelAName,
                        modelB: currentTask.value.displayModelBName
                    };
                    results.value.push(record);
                    
                    // 进度 +1
                    completedCount.value++;

                    // 每投完一票，立刻把这条结果发给飞书
                    submitSingleVoteToFeishu(record);
                    
                    // 延迟 1 秒后自动切换到下一题（给用户留出 1 秒的时间看一眼胜出结果）
                    setTimeout(() => {
                        nextTask();
                    }, 1000);
                };

                const isSubmitting = ref(false);
                const submitSuccess = ref(false);
                const submitError = ref(false);

                // 发送单条数据到飞书 Webhook
                const submitSingleVoteToFeishu = async (r) => {
                    const webhookUrl = 'https://nankai.feishu.cn/base/automation/webhook/event/L3lIafnaEw3BkThLPb2cogWyn5g';
                    
                    try {
                        const payload = {
                            session_id: sessionId.value, // 用于标识这是同一个用户的连续评测
                            timestamp: new Date().toISOString(),
                            task_id: r.originalId,
                            choice: r.choice,
                            winner: r.winnerName || '无',
                            modelA: r.modelA,
                            modelB: r.modelB
                        };

                        await fetch(webhookUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: {
                                'Content-Type': 'text/plain',
                            },
                            body: JSON.stringify(payload)
                        });

                        submitSuccess.value = true;
                        // 为了避免提示一直亮着，几秒后可以清除状态（可选）
                        setTimeout(() => submitSuccess.value = false, 3000);
                    } catch (error) {
                        submitError.value = true;
                        console.error('Webhook Request Failed:', error);
                    }
                };

                const nextTask = () => {
                    // 无限模式：只要点下一组，就继续往后走
                    currentTaskIndex.value++;
                    revealed.value = false;
                    resetViewer();
                    
                    // 如果题库快见底了，再动态生成一批接在后面，实现真正的无限流
                    if (currentTaskIndex.value > tasks.value.length - 5) {
                        tasks.value = tasks.value.concat(generateQueue());
                    }
                };

                const restart = () => {
                    results.value = [];
                    currentTaskIndex.value = 0;
                    revealed.value = false;
                    isFinished.value = false;
                    submitSuccess.value = false;
                    submitError.value = false;
                    resetViewer();
                    initTasks();
                };

                return {
                    tasks, currentTaskIndex, currentTask, revealed, isFinished, results,
                    completedCount, targetTaskCount,
                    isSubmitting, submitSuccess, submitError,
                    globalScale, wrapperStyle, onImgLoad, onWheel,
                    onMouseDown, onMouseMove, onMouseUp, vote, nextTask, restart
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
